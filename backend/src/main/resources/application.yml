server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always

spring:
  application:
    name: elms-api
  datasource:
    url: jdbc:h2:mem:elms;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    database-platform: org.hibernate.dialect.H2Dialect
    properties:
      hibernate:
        format_sql: false
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql
      continue-on-error: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

elms:
  leave:
    quota:
      CASUAL: 12
      SICK: 10
      EARNED: 15
      COMP_OFF: 5

logging:
  level:
    com.elms: INFO
